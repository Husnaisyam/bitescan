<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Home - BiteScanApp</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons/font/bootstrap-icons.css">
  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #f7f7f7;
      margin: 0;
      padding: 0;
      display: flex;
      flex-direction: column;
      min-height: 100vh;
    }

    header {
      background-color: #9bcfe2;
      color: white;
      padding: 15px;
      text-align: center;
    }

    header h1 {
      margin: 0;
      font-size: 1.5rem;
    }

    .content {
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
      padding: 20px;
    }

    section {
      background-color: white;
      padding: 30px;
      border-radius: 8px;
      box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
      margin: 20px 0;
      max-width: 600px;
    }

    section h2 {
      font-size: 1.75rem;
      color: #333;
    }

    section p {
      color: #555;
      font-size: 1rem;
      margin-top: 10px;
    }

    footer {
      background-color: #9bcfe2;
      color: white;
      padding: 10px;
      text-align: center;
    }

    footer p {
      margin: 0;
      font-size: 0.875rem;
    }

    footer a {
      color: white;
      text-decoration: none;
    }

    footer a:hover {
      text-decoration: underline;
    }
  </style>
</head>
<body>

  <header>
    <h1>Welcome to BiteScanApp</h1>
  </header>

  <div class="content">
    <section>
      <h2>Your Personal Nutrition Assistant</h2>
      <p>Track your meals, analyze your diet, and stay healthy with ease.</p>
    </section>
  </div>

  <footer>
    <p>&copy; 2025 BiteScanApp. All rights reserved. <a href="#">Privacy Policy</a></p>
  </footer>

  <script>
    setTimeout(function() {
      window.location.href = "meal-history.html";
    }, 2000);
  </script>

</body>
</html>
