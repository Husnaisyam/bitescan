<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign Up - BiteScan</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons/font/bootstrap-icons.css">
  <style>
    body {
      background-color: #f7f7f7;
      font-family: Arial, sans-serif;
    }
    .container {
      max-width: 450px;
      margin-top: 50px;
      padding: 30px;
      background-color: #fff;
      border-radius: 8px;
      box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
    }
    .logo img {
      width: 120px;
      height: 120px;
      border-radius: 50%;
      margin-bottom: 20px;
    }
    .form-control {
      border-radius: 10px;
      height: 45px;
      font-size: 16px;
      margin-bottom: 15px;
    }
    .btn-primary {
      border-radius: 10px;
      padding: 12px;
      font-size: 16px;
      background-color: #000;
      border: none;
      width: 100%;
    }
    .btn-register {
      border-radius: 10px;
      padding: 12px;
      font-size: 16px;
      background-color: transparent;
      border: 2px solid #007bff;
      color: #007bff;
      margin: 15px 0;
      width: 100%;
    }
    .btn-primary:hover, .btn-register:hover {
      opacity: 0.8;
    }
    a {
      color: #007bff;
      text-decoration: none;
    }
    a:hover {
      text-decoration: underline;
    }
    @media (max-width: 576px) {
      .container {
        width: 90%;
        margin-top: 30px;
      }
    }
  </style>
</head>
<body>
  <div class="container d-flex flex-column justify-content-center align-items-center" style="height: 100vh;">
    <div class="logo">
      <img src="bitescan.jpg" alt="BiteScan Logo">
    </div>
    <form action="signup.php" method="POST" class="w-100">
      <div class="mb-3">
        <input type="text" name="name" class="form-control" placeholder="Name" required>
      </div>
      <div class="mb-3">
        <input type="email" name="email" class="form-control" placeholder="Email" required>
      </div>
      <div class="mb-3">
        <input type="password" name="password" class="form-control" placeholder="Password" required>
      </div>
      <div class="mb-3">
        <input type="number" name="weight" class="form-control" placeholder="Weight (kg)" required step="0.1">
      </div>
      <div class="mb-3">
        <input type="number" name="height" class="form-control" placeholder="Height (cm)" required step="0.1">
      </div>
      <div class="mb-3">
        <input type="number" name="age" class="form-control" placeholder="Age" required>
      </div>
      <div class="mb-3">
        <select name="gender" class="form-control" required>
          <option value="" disabled selected>Gender</option>
          <option value="male">Male</option>
          <option value="female">Female</option>
        </select>
      </div>
      <div class="mb-3">
        <select name="activity_level" class="form-control" required>
          <option value="" disabled selected>Activity Level</option>
          <option value="sedentary">Sedentary (little to no exercise)</option>
          <option value="light">Light (light exercise 1-3 days per week)</option>
          <option value="moderate">Moderate (moderate exercise 3-5 days per week)</option>
          <option value="active">Active (intense exercise 6-7 days per week)</option>
          <option value="very_active">Very Active (very intense exercise or physical job)</option>
        </select>
      </div>
      <button type="submit" class="btn btn-primary">Register</button>
    </form>
    <a href="index.html" class="btn-register w-100"><i class="bi bi-arrow-left-circle"></i> Back to Sign In</a>
  </div>
</body>
</html>
